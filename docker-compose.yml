services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "3001"
      DATA_DIR: /app/data
    volumes:
      - learning_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  learning_data:
